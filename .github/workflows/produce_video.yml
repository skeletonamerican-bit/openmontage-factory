name: Produce Video

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel'
        required: true
        type: choice
        options: [weirdhistory, crimeledger, mindtactics, all]
      topic:
        description: 'Video topic'
        required: true
        type: string

jobs:
  weirdhistory:
    if: inputs.channel == 'weirdhistory' || inputs.channel == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CHANNEL: weirdhistory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install kokoro edge-tts faster-whisper \
            kaggle requests python-dotenv pillow soundfile \
            numpy
          sudo apt-get install -y ffmpeg
      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
        run: python pipeline/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-weirdhistory
          path: output/*.mp4
          retention-days: 30

  crimeledger:
    if: inputs.channel == 'crimeledger' || inputs.channel == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CHANNEL: crimeledger
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install kokoro edge-tts faster-whisper \
            kaggle requests python-dotenv pillow soundfile \
            numpy
          sudo apt-get install -y ffmpeg
      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
        run: python pipeline/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-crimeledger
          path: output/*.mp4
          retention-days: 30

  mindtactics:
    if: inputs.channel == 'mindtactics' || inputs.channel == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      CHANNEL: mindtactics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install kokoro edge-tts faster-whisper \
            kaggle requests python-dotenv pillow soundfile \
            numpy
          sudo apt-get install -y ffmpeg
      - name: Run pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOPIC: ${{ inputs.topic }}
        run: python pipeline/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-mindtactics
          path: output/*.mp4
          retention-days: 30
