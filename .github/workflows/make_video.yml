name: Make Video Factory

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1,3,5'

jobs:
  build_video:
    runs-on: ubuntu-latest
    env:
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and espeak
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Select topic
        run: python scripts/select_topic.py

      - name: Generate script
        run: python scripts/generate_script.py

      - name: Fetch assets
        run: python scripts/fetch_assets.py

      - name: Generate images
        run: python scripts/generate_images.py

      - name: Generate TTS
        run: python scripts/generate_tts.py

      - name: Assemble video
        run: python scripts/assemble_video.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video_factory_output
          path: projects/${{ env.CHANNEL }}

      - name: Notify Telegram
        env:
          ARTIFACT_URL: https://github.com/${{ github.repository }}/suites/${{ github.run_id }}/artifacts
        run: python scripts/notify_telegram.py

      - name: Commit topic state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add topic_state.json
          if git diff --cached --quiet; then
            echo "No topic state changes to commit"
          else
            git commit -m "Update topic state for ${{ env.CHANNEL }}"
            git push
          fi
