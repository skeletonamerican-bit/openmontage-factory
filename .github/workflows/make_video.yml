name: Make Video Factory

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel"
        required: true
        default: "weirdhistory"
        type: choice
        options:
          - weirdhistory
          - crimeledger
          - mindtactics
      topic:
        description: "Topic (empty=auto-rotate)"
        required: false
        default: ""

jobs:
  build_video:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y ffmpeg espeak-ng espeak-data libespeak1 libsndfile1

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh && echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python deps
        run: uv pip install --system --no-cache -r requirements.txt

      - name: Select topic
        id: select_topic
        run: python scripts/select_topic.py
        env:
          CHANNEL: ${{ github.event.inputs.channel || '' }}
          TOPIC: ${{ github.event.inputs.topic || '' }}
          GITHUB_OUTPUT: $GITHUB_OUTPUT
          GITHUB_ENV: $GITHUB_ENV

      - name: Generate script
        run: python scripts/generate_script.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_MODELS_TOKEN || secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ steps.select_topic.outputs.CHANNEL }}
          TOPIC: ${{ steps.select_topic.outputs.TOPIC }}

      - name: Generate AI assets (Kaggle T4)
        run: python scripts/generate_assets.py
        env:
          CHANNEL: ${{ steps.select_topic.outputs.CHANNEL }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: Generate TTS
        run: python scripts/generate_tts.py
        env:
          CHANNEL: ${{ steps.select_topic.outputs.CHANNEL }}

      - name: Assemble video
        run: python assemble_v2.py
        env:
          CHANNEL: ${{ steps.select_topic.outputs.CHANNEL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.select_topic.outputs.CHANNEL }}-${{ github.run_id }}
          path: projects/*/render/FINAL_v3.mp4
          retention-days: 7

      - name: Send to Telegram
        if: always()
        run: python scripts/notify_telegram.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHANNEL: ${{ steps.select_topic.outputs.CHANNEL }}
          TOPIC: ${{ steps.select_topic.outputs.TOPIC }}
          RUN_ID: ${{ github.run_id }}
          STATUS: ${{ job.status }}
        continue-on-error: true

      - name: Commit topic state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add topic_state.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update topic state [${{ steps.select_topic.outputs.CHANNEL }}]"
            git push
          fi
