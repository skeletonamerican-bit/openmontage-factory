name: Daily Factory
on:
  schedule:
    - cron: '0 0 * * 1,3,5' # Mon, Wed, Fri
  workflow_dispatch: # Allow manual triggering

jobs:
  run-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Select Topic
        id: select_topic
        run: |
          # Run the manager script and parse output
          output=$(python tools/manage_topic.py)
          echo "$output" >> $GITHUB_ENV
          echo "Selected: $output"
      - name: Run Factory
        run: |
          echo "Running factory for Channel: ${{ env.CHANNEL }}, Topic: ${{ env.TOPIC }}"
          # Add actual execution command here, e.g.:
          # python run_pipeline.py --channel ${{ env.CHANNEL }} --topic "${{ env.TOPIC }}"
      - name: Commit State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add topic_state.json
          git commit -m "Update topic state for ${{ env.CHANNEL }}"
          git push
